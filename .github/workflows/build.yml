name: Build

on:
  workflow_dispatch:

jobs:
  Build-PC:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-2022
          artifact: windows-x86_64
        - os: ubuntu-22.04
          artifact: linux-x86_64
        - os: ubuntu-22.04-arm
          artifact: linux-arm64
        - os: macos-15
          artifact: macos-arm64
        - os: macos-15-intel
          artifact: macos-x86_64

    steps:
    - name: Obtain latest version of the repository
      uses: actions/checkout@v4
    - name: Set up Python 3
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install and build in a virtual environment
      shell: bash
      run: |
        python -m venv .venv
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          venv_python=.venv/Scripts/python.exe
        else
          venv_python=.venv/bin/python
        fi
        "$venv_python" -m pip install -r requirements.txt pyinstaller
        "$venv_python" -m PyInstaller riitag-rpc.spec
    - name: Mark as executable
      if: ${{ matrix.os != 'windows-2022' }}
      run: chmod -R +x dist/
    - name: Publish Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: dist
  
  Collect-Artifacts:
    runs-on: ubuntu-22.04
    needs: [Build-PC]
    steps:
      - name: Download linux-x86_64
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: linux-x86_64

      - name: Download linux-arm64
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: linux-arm64

      - name: Download macos-arm64
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: macos-arm64

      - name: Download macos-x86_64
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64
          path: macos-x86_64

      - name: Download windows-x86_64
        uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: windows-x86_64

      - name: Get environment variables
        id: get_repository_name
        run: |
          echo REPOSITORY_NAME=$(echo "$GITHUB_REPOSITORY" | awk -F / '{print $2}' | sed -e "s/:refs//") >> $GITHUB_ENV
          echo DATETIME=$(echo $(date '+%Y%m%d-%H%M%S')) >> $GITHUB_ENV
      
      - name: Collect artifacts
        run: |
          mkdir -p releases
          mv linux-x86_64/riitag-rpc       releases/RiiTag-RPC_Linux-x86_64
          mv linux-arm64/riitag-rpc        releases/RiiTag-RPC_Linux-arm64
          mv macos-arm64/riitag-rpc        releases/RiiTag-RPC_MacOS-arm64
          mv macos-x86_64/riitag-rpc       releases/RiiTag-RPC_MacOS-x86_64
          mv windows-x86_64/riitag-rpc.exe releases/RiiTag-RPC_Windows-x86_64.exe
          chmod -R +x releases/
          tar -cjf all-artifacts.tar.bz2 releases/

      - name: Publish collected artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-artifacts
          path: all-artifacts.tar.bz2

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.REPOSITORY_NAME }}-${{ env.DATETIME }}
          draft: false
          prerelease: true
          generate_release_notes: true
          name: Nightly-${{ env.REPOSITORY_NAME }}-${{ env.DATETIME }}
          files: releases/*
